name: Build WA Hub 3 (Windows + Linux + Android)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # ───────────────────────── Windows ─────────────────────────
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download mpv (Windows build, bundled with the app)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p vendor/mpv mpvdl
          gh release download --repo shinchiro/mpv-winbuild-cmake --pattern "mpv-x86_64-2*.7z" --dir mpvdl --clobber
          ls -la mpvdl
          7z x mpvdl/*.7z -ovendor/mpv -y > /dev/null
          EXE=$(find vendor/mpv -name mpv.exe | head -1)
          DIR=$(dirname "$EXE")
          if [ "$DIR" != "vendor/mpv" ]; then cp -r "$DIR"/* vendor/mpv/; fi
          test -f vendor/mpv/mpv.exe && echo "mpv.exe ready"

      - run: npm install --no-audit --no-fund
      - run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Hub-3-Windows
          path: desktop/release/*.exe

  # ───────────────────────── Linux ─────────────────────────
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: mkdir -p vendor/mpv
      - run: npm install --no-audit --no-fund
      - run: npm run dist:linux

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Hub-3-Linux
          path: |
            desktop/release/*.AppImage
            desktop/release/*.tar.gz

  # ───────────────────────── Android ─────────────────────────
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bundle Node engine (Baileys)
        working-directory: android/nodejs-project
        run: |
          npm install --no-audit --no-fund
          mkdir -p ../app/src/main/assets/nodejs
          npx esbuild index.js --bundle --platform=node --target=node18 --format=cjs \
            --outfile=../app/src/main/assets/nodejs/main.js \
            --external:sharp --external:jimp --external:link-preview-js \
            --external:bufferutil --external:utf-8-validate --external:audio-decode \
            --external:qrcode-terminal --external:@ffmpeg-installer/ffmpeg
          ls -la ../app/src/main/assets/nodejs

      - name: Fetch nodejs-mobile (libnode.so)
        run: |
          curl -fL -o node.zip https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-android.zip
          mkdir -p app/libnode
          unzip -q node.zip -d node_tmp
          SRC=$(dirname "$(find node_tmp -type d -name bin | head -1)")
          cp -r "$SRC"/bin app/libnode/bin
          cp -r "$SRC"/include app/libnode/include
          find app/libnode -name libnode.so

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon 2>&1 | tee full.log | grep -E "^e: |^w: .*error|What went wrong|FAILED|Execution failed" ; exit ${PIPESTATUS[0]}

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../WA-Hub-3-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Hub-3-Android
          path: WA-Hub-3-android.apk

  # ───────────────────────── Release (عند وسم v*) ─────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
